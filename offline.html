<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glucer</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#1E1530; color:#F3EEF8; font-family:system-ui,sans-serif; text-align:center; }
  .box { max-width:360px; padding:24px; }
  h1 { margin:0 0 8px; font-size:24px; }
  p { margin:0 0 20px; color:#B6A8CC; line-height:1.5; }
  button { background:#F0B235; color:#1E1530; border:0; border-radius:999px; padding:12px 24px; font-weight:700; font-size:16px; cursor:pointer; }
</style>
</head>
<body>
  <div class="box">
    <h1>You're offline</h1>
    <p>Glucer needs an internet connection. Check your connection and try again.</p>
    <button onclick="location.href='https://glucer.com/chat.html'">Try again</button>
  </div>
</body>
</html>
